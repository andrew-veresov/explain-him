name: Bootstrap public facade

on:
  push:
    branches: [public-facade-v1]
    paths:
      - '.bootstrap/**'
      - '.github/workflows/bootstrap-public-facade.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-public-facade-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: public-facade-v1
          fetch-depth: 0

      - name: Reconstruct curated public tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/chunk-* | tr -d '\r\n' | base64 --decode > /tmp/explain-him-public.tar.xz
          echo '043f1bdee39f423d9b7513b44b6ab0f7436783e908e8d04b35fa65a2d0d9a234  /tmp/explain-him-public.tar.xz' | sha256sum --check
          tar -xJf /tmp/explain-him-public.tar.xz -C .
          rm -rf .bootstrap _probe-access.txt .github/workflows/bootstrap-public-facade.yml

      - name: Validate materialized facade
        shell: bash
        run: |
          set -euo pipefail
          python tools/check_public_demo.py
          node --test tests/workspace-core.test.mjs tests/webmcp-runtime.test.mjs

      - name: Commit product tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publish Explain Him public facade'
          git push origin HEAD:${GITHUB_REF_NAME}
