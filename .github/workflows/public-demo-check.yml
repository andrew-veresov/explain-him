name: Public demo checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
      - name: Check public boundaries and static integrity
        run: python tools/check_public_demo.py
      - name: Test workspace, WebMCP, evals and Presentation Capability contract
        run: node --test tests/*.test.mjs
