schema_version: explain-him-explanation.v4
id: explain-him-public-demo
version: 0.4.0
title: How Explain Him works
language: en
status: public-demo

scope:
  repository: andrew-veresov/explain-him
  root: .
  skill_activation: repository-only
  persist_skill_globally: false

bootstrap:
  human: README.md
  agent: AGENTS.md

skills:
  - id: explain-him
    entrypoint: skills/explain-him/SKILL.md
    responsibility: grounding-and-github-retrieval
  - id: explain-him-presentation
    entrypoint: skills/explain-him-presentation/SKILL.md
    responsibility: typed-block-selection-and-webmcp-embedding

answer_runtime:
  owner: personal-agent
  primary_source: authored-page
  deeper_source: repository-via-personal-agent-github-integration
  browser_readable_knowledge_bundle: none
  webmcp_repository_access: forbidden
  webmcp_answer_generation: forbidden

knowledge:
  source_precedence:
    - resolutions
    - index.html
    - explain-him.yaml
    - knowledge
    - README.md
  excluded_paths:
    - tests
    - tools
    - .github
  documents:
    - path: index.html
      topic: originator-authored-explanation
    - path: knowledge/00-overview.md
      topic: product-model
    - path: knowledge/01-originator-flow.md
      topic: originator-flow
    - path: knowledge/02-user-agent-flow.md
      topic: user-agent-flow
    - path: knowledge/03-grounding-and-status.md
      topic: grounding
    - path: knowledge/04-question-loop.md
      topic: question-loop
    - path: knowledge/05-product-boundaries.md
      topic: product-boundaries
    - path: knowledge/06-browser-local-workspace.md
      topic: browser-local-workspace
    - path: knowledge/07-presentation-capabilities.md
      topic: presentation-capabilities

presentation:
  authored_entrypoint: index.html
  authored_by: originator
  typed_block_schema: schemas/explanation-block.v1.schema.json
  supported_typed_blocks:
    - callout
    - comparison
    - workflow
    - timeline
    - diagram
  policy:
    authored_layer: immutable
    consumer_local_capabilities: allowed
    arbitrary_html: forbidden
    arbitrary_javascript: forbidden
    external_html_embedding: forbidden
  capabilities:
    - id: explain-him-safe-text
      provider: explain-him
      trust: builtin
      execution: embedded
      fallback: true
      role: legacy-safe-text-fallback
    - id: explain-him-safe-block
      provider: explain-him
      trust: builtin
      execution: embedded
      fallback: false
      role: typed-page-block-renderer
      accepts:
        - callout
        - comparison
        - workflow
        - timeline
        - diagram
    - id: archify
      provider: github:tt-a1i/archify
      trust: originator-approved
      execution: personal-agent
      fallback: false
      role: reference-presentation-specialist
      repository_reasoning: forbidden
      output_embedding: translate-to-safe-typed-block
  browser_local_workspace:
    status: demo-only
    schema_version: explain-him-local-workspace.v2
    state_model: typed-presentation-operation-log
    authored_layer: immutable
    durable_operations: [add-presentation, remove-presentation]
    persistence: indexeddb-with-memory-fallback
    renderer: safe-typed-dom
    undo_redo: human-control
    export: json
    destructive_reset_requires_confirmation: true

webmcp:
  status: current-demo
  api: document.modelContext
  registration: imperative-top-level-javascript
  declarative_api_required: false
  purpose: typed-result-delivery-to-shared-page
  tools:
    - get_explanation_contract
    - apply_explanation
  contract_returns:
    - repository-location
    - grounding-skill-location
    - typed-block-schema-location
    - authored-insertion-targets
    - browser-local-block-ids
  apply_operations:
    - add
    - remove
  allowed_capabilities:
    - integration-contract-read
    - typed-local-block-add
    - typed-local-block-remove
  forbidden_capabilities:
    - diagnostics-as-agent-tool
    - knowledge-search
    - repository-read
    - repository-search
    - claim-resolution
    - answer-generation
    - grounding
    - presentation-strategy
    - arbitrary-html-injection
    - github-issue-search
    - github-issue-create

question_loop:
  channel: github-issues
  repository: andrew-veresov/explain-him
  execution_owner: personal-agent-github-integration
  webmcp_gateway: false
  template: question-template.md
  confirmation_before_write: true
  minimize_personal_context: true
  repository_language: en

claims:
  - id: repository-is-public-source-of-truth
    status: current
    evidence: knowledge/00-overview.md
  - id: originator-authored-page-is-first-class-source
    status: current
    evidence: resolutions/2026-08-30-webmcp-challenge-surface.md
  - id: grounding-skill-exists
    status: current
    evidence: skills/explain-him/SKILL.md
  - id: typed-presentation-skill-exists
    status: current
    evidence: skills/explain-him-presentation/SKILL.md
  - id: browser-local-typed-workspace-exists
    status: demo-only
    evidence: resolutions/2026-08-26-browser-local-workspace.md
  - id: webmcp-is-typed-result-delivery-channel
    status: current
    evidence: resolutions/2026-08-30-webmcp-challenge-surface.md
  - id: direct-chatgpt-chrome-sidebar-site-tools
    status: open
    evidence: WEBMCP_CHALLENGE.md
  - id: github-issues-are-sufficient-feedback
    status: hypothesis
    evidence: knowledge/04-question-loop.md
  - id: repository-project-language-is-english
    status: current
    evidence: resolutions/2026-08-28-project-language.md
