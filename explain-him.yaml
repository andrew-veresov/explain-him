schema_version: explain-him-explanation.v1
id: explain-him-public-demo
version: 0.1.0
title: Как работает Explain Him
language: ru
status: public-demo

products:
  standard: Explain Him
  pro: Explain Him Pro

scope:
  repository: andrew-veresov/explain-him
  root: .
  skill_activation: repository-only
  persist_skill_globally: false

bootstrap:
  human: README.md
  agent: AGENTS.md

skills:
  - id: explain-him
    manifest: skills/explain-him/skill.yaml
    entrypoint: skills/explain-him/SKILL.md
    browser_delivery:
      preferred: webmcp-register-skill
      compatibility_fallback: webmcp-readonly-skill-tool
    non_browser_delivery: repository-skill

answer_runtime:
  owner: personal-agent
  primary_source: authored-page
  deeper_source: repository-via-personal-agent-github-integration
  browser_readable_knowledge_bundle: none
  webmcp_repository_access: forbidden
  webmcp_answer_generation: forbidden

knowledge:
  source_precedence:
    - resolutions
    - index.html
    - explain-him.yaml
    - knowledge
    - README.md
  excluded_paths:
    - tests
    - tools
    - .github
  documents:
    - path: index.html
      topic: originator-authored-explanation
    - path: knowledge/00-overview.md
      topic: product-model
    - path: knowledge/01-originator-flow.md
      topic: originator-flow
    - path: knowledge/02-user-agent-flow.md
      topic: user-agent-flow
    - path: knowledge/03-grounding-and-status.md
      topic: grounding
    - path: knowledge/04-question-loop.md
      topic: question-loop
    - path: knowledge/05-product-boundaries.md
      topic: product-boundaries
    - path: knowledge/06-browser-local-workspace.md
      topic: browser-local-workspace

visualization:
  static_entrypoint: index.html
  authored_by: originator
  layout: two-panel
  left_panel: adaptive-visual-explanation
  right_panel: personal-agent-chat-simulation
  chat_runtime: deterministic-demo-simulation
  optional_protocol: A2UI
  browser_local_workspace:
    status: demo-only
    state_model: typed-operation-log
    authored_layer: immutable
    durable_operations: [add-block, remove-local-block]
    ephemeral_operations: [focus-block]
    persistence: indexeddb-with-memory-fallback
    renderer: safe-dom-text-content
    undo_redo: true
    export: json
    destructive_reset_requires_confirmation: true

webmcp:
  skill_delivery:
    preferred: registerSkill
    status: target-proposal
    compatibility_fallback_tool: get_explain_him_skill
    descriptor_contains_knowledge: false
  allowed_capabilities:
    - skill-delivery
    - visual-context-read
    - local-workspace-read
    - visual-focus
    - local-block-add
    - local-block-remove
    - local-undo-redo
  forbidden_capabilities:
    - knowledge-search
    - repository-read
    - repository-search
    - claim-resolution
    - answer-generation
    - github-issue-search
    - github-issue-create

question_loop:
  channel: github-issues
  repository: andrew-veresov/explain-him
  execution_owner: personal-agent-github-integration
  webmcp_gateway: false
  template: question-template.md
  confirmation_before_write: true
  minimize_personal_context: true

claims:
  - id: repository-is-public-source-of-truth
    status: current
    evidence: knowledge/00-overview.md
  - id: originator-authored-page-is-first-class-source
    status: current
    evidence: resolutions/2026-08-27-webmcp-skill-ui-runtime.md
  - id: repository-scoped-skill-exists
    status: current
    evidence: skills/explain-him/SKILL.md
  - id: browser-local-typed-workspace-exists
    status: demo-only
    evidence: resolutions/2026-08-26-browser-local-workspace.md
  - id: webmcp-is-ui-only
    status: current
    evidence: resolutions/2026-08-27-webmcp-skill-ui-runtime.md
  - id: native-register-skill
    status: target
    evidence: resolutions/2026-08-27-webmcp-skill-ui-runtime.md
  - id: universal-browser-agent-compatibility
    status: open
    evidence: knowledge/06-browser-local-workspace.md
  - id: github-issues-are-sufficient-feedback
    status: hypothesis
    evidence: knowledge/04-question-loop.md
